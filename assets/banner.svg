<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3"/>
    </pattern>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #ffffff;
        letter-spacing: -1px;
      }
      .gradient-span {
        fill: url(#primary-glow);
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      
      /* Dynamic Background Keyframes */
      @keyframes floatSlow {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(2deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes floatReverse {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(14px) rotate(-3deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes pulseGlow {
        0% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
        100% { opacity: 0.35; transform: scale(1); }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -40; }
      }
      @keyframes orbitCard {
        0% { transform: translate(0, 0); }
        50% { transform: translate(6px, -8px); }
        100% { transform: translate(0, 0); }
      }

      .floating-orb-1 {
        animation: pulseGlow 7s ease-in-out infinite;
        transform-origin: 200px 100px;
      }
      .floating-orb-2 {
        animation: pulseGlow 9s ease-in-out infinite 2s;
        transform-origin: 1000px 300px;
      }
      .card-float-1 {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .card-float-2 {
        animation: floatReverse 7s ease-in-out infinite 1s;
      }
      .card-float-3 {
        animation: orbitCard 5s ease-in-out infinite 0.5s;
      }
      .animated-circuit {
        stroke-dasharray: 8 6;
        animation: flowDash 3s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bg-grad)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Dynamic Glowing Orbs in Deep Background -->
  <g class="floating-orb-1">
    <circle cx="180" cy="90" r="140" fill="#6366f1" opacity="0.2" filter="blur(40px)"/>
  </g>
  <g class="floating-orb-2">
    <circle cx="1020" cy="310" r="160" fill="#ec4899" opacity="0.18" filter="blur(45px)"/>
  </g>
  <circle cx="600" cy="200" r="180" fill="#3b82f6" opacity="0.12" filter="blur(50px)"/>

  <!-- Dynamic Cybernetic Data Connections (Background) -->
  <g opacity="0.6">
    <path class="animated-circuit" d="M 80,340 C 260,340 300,290 480,290 S 700,340 900,340 S 1080,270 1140,270" fill="none" stroke="#6366f1" stroke-width="2"/>
    <path class="animated-circuit" d="M 120,60 C 320,60 420,110 650,110 S 880,50 1120,50" fill="none" stroke="#ec4899" stroke-width="1.5" style="animation-direction: reverse;"/>
  </g>

  <!-- Dynamic Background Geometric Accent Cards (Strictly lower layer / right & edges) -->
  <g class="card-float-1" opacity="0.75">
    <rect x="940" y="60" width="190" height="74" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="url(#card-border)" stroke-width="1.5"/>
    <circle cx="968" cy="97" r="14" fill="#3b82f6" fill-opacity="0.25"/>
    <path d="M 964 97 L 967 100 L 973 94" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
    <text x="992" y="93" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">SCIM 2.0</text>
    <text x="992" y="111" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Automated Sync</text>
  </g>

  <g class="card-float-2" opacity="0.75">
    <rect x="910" y="240" width="220" height="78" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="url(#card-border)" stroke-width="1.5"/>
    <circle cx="940" cy="279" r="14" fill="#10b981" fill-opacity="0.25"/>
    <path d="M 935 279 L 945 279 M 940 274 L 940 284" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
    <text x="964" y="274" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">Lifecycle Billing</text>
    <text x="964" y="292" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Metered &amp; Tiered</text>
  </g>

  <g class="card-float-3" opacity="0.6">
    <rect x="60" y="230" width="170" height="66" rx="12" fill="#1e293b" fill-opacity="0.65" stroke="url(#card-border)" stroke-width="1.5"/>
    <circle cx="86" cy="263" r="13" fill="#8b5cf6" fill-opacity="0.25"/>
    <text x="82" y="268" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">⚡</text>
    <text x="108" y="259" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">IGA Engine</text>
    <text x="108" y="275" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5">Role Governance</text>
  </g>

  <!-- FOREGROUND LAYER: Brand Badge, Header, Subtitle, and Feature Tags -->
  <!-- Top Badge -->
  <g transform="translate(180, 56)">
    <rect width="250" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.8"/>
    <circle cx="16" cy="16" r="5" fill="#22c55e"/>
    <text x="32" y="21" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" letter-spacing="0.5">CURATED KNOWLEDGE BASE</text>
  </g>

  <!-- Title & Subtitle in crisp foreground -->
  <g transform="translate(180, 142)">
    <text class="title-text">
      Awesome <tspan class="gradient-span">Account &amp; Subscription</tspan> Management
    </text>
    <text class="subtitle-text" y="44">
      Enterprise SaaS Admin Consoles • Open-Source IGA Platforms • SCIM Lifecycle • Subscription Billing
    </text>
  </g>

  <!-- Interactive Tag Pills in Foreground -->
  <g transform="translate(180, 240)">
    <!-- Pill 1: SCIM & SAML -->
    <g transform="translate(0, 0)">
      <rect width="136" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="16" y="23" class="pill-text">🔑 SCIM &amp; SAML</text>
    </g>

    <!-- Pill 2: Identity Governance -->
    <g transform="translate(148, 0)">
      <rect width="180" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="16" y="23" class="pill-text">🛡️ Identity Governance</text>
    </g>

    <!-- Pill 3: Subscription Billing -->
    <g transform="translate(340, 0)">
      <rect width="184" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="16" y="23" class="pill-text">💳 Subscription Billing</text>
    </g>

    <!-- Pill 4: Open Source -->
    <g transform="translate(536, 0)">
      <rect width="144" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="16" y="23" class="pill-text">🌟 Open Source</text>
    </g>

    <!-- Pill 5: Enterprise Ready -->
    <g transform="translate(692, 0)">
      <rect width="158" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="16" y="23" class="pill-text">🏢 Enterprise SaaS</text>
    </g>
  </g>

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="394" width="1200" height="6" fill="url(#primary-glow)"/>
</svg>
